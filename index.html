<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Англійські картки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#2c3240; --text:#eef0f3; --muted:#9aa3ae; --acc:#4f8cff; --acc2:#7c5cff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
  .emo { font-family:"Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:calc(18px + var(--tg-content-safe-area-inset-top, 0px)) 16px calc(40px + var(--tg-safe-area-inset-bottom, 0px)); }
  body { user-select:none; -webkit-user-select:none; overscroll-behavior:none; }
  h1 { font-size:26px; margin:6px 0 4px; }
  .sub { color:var(--muted); margin:0 0 18px; }
  h2 { font-size:16px; color:var(--muted); font-weight:600; margin:22px 0 10px; text-transform:uppercase; letter-spacing:.04em; }
  .topics { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  .topic { background:var(--card); border:2px solid var(--line); border-radius:14px; padding:14px 10px; cursor:pointer; text-align:center; user-select:none; transition:border-color .15s, transform .1s, background .15s; }
  .topic:active { transform:scale(.97); }
  .topic .e { font-size:36px; display:block; margin-bottom:6px; }
  .topic .n { font-size:15px; font-weight:600; }
  .topic .c { font-size:12px; color:var(--muted); margin-top:3px; }
  .topic.on { border-color:var(--acc); background:#1b2740; }
  .links { margin-top:10px; display:flex; gap:16px; }
  .link { color:var(--acc); cursor:pointer; font-size:14px; background:none; border:0; padding:0; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { background:var(--card); border:2px solid var(--line); color:var(--text); border-radius:999px; padding:9px 18px; font-size:15px; cursor:pointer; }
  .chip.on { border-color:var(--acc); background:#1b2740; }
  .start { margin-top:26px; width:100%; padding:16px; font-size:18px; font-weight:700; color:#fff; border:0; border-radius:14px; cursor:pointer; background:linear-gradient(90deg, var(--acc), var(--acc2)); }
  .start:disabled { opacity:.4; cursor:default; }

  /* екран карток */
  .bar { display:flex; align-items:center; gap:12px; }
  .back { background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:8px 14px; cursor:pointer; font-size:15px; }
  .count { margin-left:auto; color:var(--muted); font-size:15px; }
  .prog { height:6px; background:var(--line); border-radius:3px; margin:12px 0 0; overflow:hidden; }
  .prog > div { height:100%; background:linear-gradient(90deg, var(--acc), var(--acc2)); transition:width .25s; }
  .deck { position:relative; width:min(440px, 100%); height:min(440px, 62vh); margin:26px auto 0; perspective:1400px; touch-action:pan-y; }
  .pile { position:absolute; inset:0; border-radius:22px; background:#232835; border:1px solid var(--line); }
  .pile.p1 { transform:translate(8px, 10px) rotate(2.5deg); }
  .pile.p2 { transform:translate(-8px, 18px) rotate(-3deg); background:#1d212b; }
  .flip { position:absolute; inset:0; cursor:pointer; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.3,.7,.3,1), opacity .3s; }
  .flip.flipped { transform:rotateY(180deg); }
  .flip.go-left { transform:translateX(-130%) rotate(-18deg); opacity:0; }
  .flip.go-right { transform:translateX(130%) rotate(18deg); opacity:0; }
  .flip.flipped.go-left { transform:translateX(-130%) rotate(-18deg) rotateY(180deg); }
  .flip.flipped.go-right { transform:translateX(130%) rotate(18deg) rotateY(180deg); }
  .flip.enter { animation:enter .28s ease-out; }
  @keyframes enter { from { transform:translateY(14px) scale(.96); opacity:.4; } to { transform:none; opacity:1; } }
  .face { position:absolute; inset:0; border-radius:22px; backface-visibility:hidden; -webkit-backface-visibility:hidden;
          display:flex; flex-direction:column; align-items:center; justify-content:center; padding:22px; text-align:center;
          background:linear-gradient(160deg, #272d3b, #1a1d24); border:1px solid #363d4d; box-shadow:0 14px 34px rgba(0,0,0,.5); }
  .face.backside { transform:rotateY(180deg); background:linear-gradient(160deg, #1f3150, #1a1d24); }
  .big-e { font-size:min(110px, 22vw); line-height:1.1; margin-bottom:12px; }
  .word { font-size:clamp(28px, 7vw, 40px); font-weight:800; }
  .tr { font-size:clamp(22px, 5.5vw, 30px); color:#cfe0ff; margin-top:10px; font-weight:600; }
  .tag { position:absolute; top:14px; left:16px; font-size:12px; color:var(--muted); }
  .hint { position:absolute; bottom:14px; font-size:12px; color:var(--muted); }
  .say { background:none; border:0; font-size:26px; cursor:pointer; margin-top:6px; }
  .ctrl { display:flex; justify-content:center; gap:10px; margin-top:30px; }
  .ctrl button { background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:12px; padding:13px 20px; font-size:16px; cursor:pointer; }
  .ctrl button.main { background:var(--acc); border-color:var(--acc); color:#fff; }
  .ctrl button:disabled { opacity:.35; cursor:default; }
  .keys { text-align:center; color:var(--muted); font-size:13px; margin-top:14px; }
  .done { text-align:center; margin-top:60px; }
  .done .big-e { font-size:90px; }
  @media (max-width:560px) { .keys { display:none; } .ctrl button { padding:13px 14px; } }
</style>
</head>

// ===== Telegram =====
const tg = (window.Telegram && Telegram.WebApp && Telegram.WebApp.platform && Telegram.WebApp.platform !== 'unknown') ? Telegram.WebApp : null;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.disableVerticalSwipes(); } catch (e) {}
  try { tg.setHeaderColor('#0f1115'); tg.setBackgroundColor('#0f1115'); tg.setBottomBarColor && tg.setBottomBarColor('#0f1115'); } catch (e) {}
  try { tg.BackButton.onClick(() => { if (screen !== 'home') home(); }); } catch (e) {}
}
const haptic = kind => { try { if (!tg) return; kind === 'tick' ? tg.HapticFeedback.selectionChanged() : kind === 'done' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.impactOccurred('light'); } catch (e) {} };
const backBtn = show => { try { if (tg) show ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {} };

// ===== стан =====
const KEY = 'eng-cards-v1';
let pref = { topics: [0], count: 20, dir: 'en' };
try { Object.assign(pref, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const savePref = () => { try { localStorage.setItem(KEY, JSON.stringify(pref)); } catch (e) {} };

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const say = () => {}; const sayOld = t => { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t.replace(/\(.*?\)/g, '')); u.lang = 'en-US'; u.rate = 0.85; speechSynthesis.speak(u); } catch (e) {} };

let screen = 'home', deck = [], pos = 0, flipped = false, busy = false;

// ===== головний екран =====
function home() {
  screen = 'home'; backBtn(false);
  const sel = new Set(pref.topics);
  const total = TOPICS.filter(t => sel.has(t.id)).reduce((s, t) => s + t.words.length, 0);
  const n = pref.count === 'all' ? total : Math.min(pref.count, total);
  $('#app').innerHTML = `
    <h1><span class="emo">🃏</span> Англійські картки</h1>
    <p class="sub">${TOPICS.reduce((s, t) => s + t.words.length, 0)} слів у ${TOPICS.length} темах. Обери теми, скільки карток, і погнали.</p>
    <h2>1. Теми</h2>
    <div class="topics">${TOPICS.map(t => `<div class="topic ${sel.has(t.id) ? 'on' : ''}" data-id="${t.id}"><span class="e emo">${t.e}</span><div class="n">${esc(t.name)}</div><div class="c">${t.words.length} слів</div></div>`).join('')}</div>
    <div class="links"><button class="link" id="all">Обрати всі</button><button class="link" id="none">Зняти всі</button></div>
    <h2>2. Скільки карток</h2>
    <div class="chips" id="cnt">${[10, 20, 30, 50, 'all'].map(c => `<button class="chip ${pref.count === c ? 'on' : ''}" data-c="${c}">${c === 'all' ? 'Усі' : c}</button>`).join('')}</div>
    <h2>3. Що показувати спершу</h2>
    <div class="chips" id="dir">${[['en', 'Англійське слово'], ['ua', 'Українське слово'], ['mix', 'Впереміш']].map(([k, v]) => `<button class="chip ${pref.dir === k ? 'on' : ''}" data-d="${k}">${v}</button>`).join('')}</div>
    <button class="start" id="go" ${n ? '' : 'disabled'}>${n ? `Почати — ${n} карток` : 'Обери хоча б одну тему'}</button>`;
  document.querySelectorAll('.topic').forEach(el => el.onclick = () => {
    const id = +el.dataset.id; sel.has(id) ? sel.delete(id) : sel.add(id); pref.topics = [...sel]; savePref(); home();
  });
  $('#all').onclick = () => { pref.topics = TOPICS.map(t => t.id); savePref(); home(); };
  $('#none').onclick = () => { pref.topics = []; savePref(); home(); };
  document.querySelectorAll('#cnt .chip').forEach(el => el.onclick = () => { pref.count = el.dataset.c === 'all' ? 'all' : +el.dataset.c; savePref(); home(); });
  document.querySelectorAll('#dir .chip').forEach(el => el.onclick = () => { pref.dir = el.dataset.d; savePref(); home(); });
  $('#go').onclick = start;
}

function start() {
  const pool = TOPICS.filter(t => pref.topics.includes(t.id)).flatMap(t => t.words);
  const picked = shuffle(pool).slice(0, pref.count === 'all' ? pool.length : pref.count);
  deck = picked.map(w => ({ ...w, front: pref.dir === 'mix' ? (Math.random() < 0.5 ? 'en' : 'ua') : pref.dir }));
  pos = 0; flipped = false; cards(true);
}

// ===== картки =====
function cards(enter) {
  screen = 'cards'; backBtn(true);
  if (pos >= deck.length) return finish();
  const w = deck[pos], left = deck.length - pos;
  const frontWord = w.front === 'en' ? w.en : w.ua;
  $('#app').innerHTML = `
    <div class="bar"><button class="back" id="home">← Теми</button><div class="count">${pos + 1} / ${deck.length}</div></div>
    <div class="prog"><div style="width:${pos / deck.length * 100}%"></div></div>
    <div class="deck" id="deck">
      ${left > 2 ? '<div class="pile p2"></div>' : ''}${left > 1 ? '<div class="pile p1"></div>' : ''}
      <div class="flip ${flipped ? 'flipped' : ''} ${enter ? 'enter' : ''}" id="fc">
        <div class="face">
          <span class="tag">${esc(w.topic)}</span>
          <div class="big-e emo">${w.e}</div>
          <div class="word">${esc(frontWord)}</div>
          <span class="hint">натисни, щоб перевернути</span>
        </div>
        <div class="face backside">
          <div class="big-e emo" style="font-size:min(70px,16vw)">${w.e}</div>
          <div class="word">${esc(w.en)}</div>
                    <div class="tr">${esc(w.ua)}</div>
        </div>
      </div>
    </div>
    <div class="ctrl">
      <button id="prev" ${pos ? '' : 'disabled'}>← Назад</button>
      <button id="turn">Перевернути</button>
      <button class="main" id="next">Далі →</button>
    </div>
    <div class="keys" ${tg ? 'hidden' : ''}>Пробіл — перевернути · ← → — гортати · на телефоні можна свайпати</div>`;
  $('#home').onclick = home;
  $('#fc').onclick = flip;
  $('#turn').onclick = flip;
  $('#next').onclick = () => go(1);
  $('#prev').onclick = () => go(-1);
  document.querySelectorAll('[data-say]').forEach(b => b.onclick = e => { e.stopPropagation(); say(b.dataset.say); });
  // свайпи
  let sx = null, sy = null;
  const d = $('#deck');
  d.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  d.addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) { e.preventDefault(); go(dx < 0 ? 1 : -1); }
  });
}
function flip() {
  if (busy) return;
  flipped = !flipped; haptic('flip');
  $('#fc').classList.remove('enter');
  $('#fc').classList.toggle('flipped', flipped);
  if (flipped && deck[pos].front === 'ua') say(deck[pos].en);
}
function go(step) {
  if (busy) return;
  if (step < 0 && pos === 0) return;
  busy = true; haptic('tick');
  $('#fc').classList.remove('enter');
  $('#fc').classList.add(step > 0 ? 'go-left' : 'go-right');
  setTimeout(() => { pos += step; flipped = false; busy = false; cards(true); }, 260);
}
function finish() {
  screen = 'done'; backBtn(true); haptic('done');
  $('#app').innerHTML = `<div class="done">
    <div class="big-e emo">🎉</div>
    <h1>Готово! ${deck.length} карток</h1>
    <p class="sub">Пройди ще раз: картки щоразу перемішуються.</p>
    <div class="ctrl"><button class="main" id="again">Ще раз</button><button id="topics">Інші теми</button></div></div>`;
  $('#again').onclick = start;
  $('#topics').onclick = home;
}

document.addEventListener('keydown', e => {
  if (screen === 'cards') {
    if (e.code === 'Space' || e.key === 'Enter' || e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); flip(); }
    if (e.key === 'ArrowRight') go(1);
    if (e.key === 'ArrowLeft') go(-1);
    if (e.key === 'Escape') home();
  } else if (screen === 'done' && (e.code === 'Space' || e.key === 'Enter')) { e.preventDefault(); start(); }
});

home();
</script>
